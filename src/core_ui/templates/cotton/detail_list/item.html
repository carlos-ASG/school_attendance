<c-vars label class></c-vars>
<div class="grid grid-cols-1 gap-1 p-3 sm:grid-cols-3 sm:gap-4 {% if class %}{{ class }}{% endif %}" {{ attrs }}>
    {% if label %}
        <dt class="font-medium text-foreground">{{ label }}</dt>
        <dd class="text-muted-foreground sm:col-span-2">{{ slot }}</dd>
    {% else %}
        <dd class="text-muted-foreground sm:col-span-3">{{ slot }}</dd>
    {% endif %}
</div>
