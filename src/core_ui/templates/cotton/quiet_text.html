<c-vars class></c-vars>
<a class="
    inline-flex
    items-center
    justify-center
    rounded-full
    px-4
    py-2
    text-sm
    font-semibold
    text-primary
    underline
    decoration-border
    decoration-2
    underline-offset-4
    transition-colors
    hover:text-primary/80
    hover:decoration-primary/70
    focus-visible:ring-4
    focus-visible:ring-ring/25
    focus-visible:outline-none
    {% if class %}
    {{ class }}
    {% endif %}
    "
    {{ attrs }}
>
    {{ slot }}
</a>
