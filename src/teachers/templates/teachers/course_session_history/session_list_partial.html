<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Created</th>
        </tr>
    </thead>
    <tbody>
        {% for session in sessions %}
            <tr>
                <td><a href="{% url 'teachers:session_detail' session.pk %}">{{ session.date }}</a></td>
                <td>{{ session.created_at }}</td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="2">No sessions yet.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
