<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Created</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for session in sessions %}
            <tr>
                <td><a href="{% url 'teachers:session_detail' session.pk %}">{{ session.date }}</a></td>
                <td>{{ session.created_at }}</td>
                <td class="actions">
                    <button type="button"
                            hx-get="{% url 'teachers:session_edit' session.pk %}"
                            hx-target="closest tr"
                            hx-swap="outerHTML">
                        Editar
                    </button>
                    <button type="button"
                            hx-post="{% url 'teachers:session_delete' session.pk %}"
                            hx-target="#session-list"
                            hx-swap="innerHTML"
                            hx-confirm="¿Eliminar esta sesión?">
                        Eliminar
                    </button>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="3">No sessions yet.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
