<tr>
    <td colspan="2">
        <form method="post"
              hx-post="{% if session %}{% url 'teachers:session_edit' session.pk %}{% else %}{% url 'teachers:course_detail' course.pk %}{% endif %}"
              hx-target="#session-list"
              hx-swap="innerHTML"
              class="inline-form">
            {% csrf_token %}
            {{ form.date }}
            {% if form.date.errors %}
                <ul class="errorlist">{{ form.date.errors }}</ul>
            {% endif %}
            <button type="submit">Guardar</button>
            {% if session %}
                <button type="button"
                        hx-get="{% url 'teachers:course_detail' course.pk %}"
                        hx-target="#session-list"
                        hx-swap="innerHTML"
                        hx-select="#session-list">
                    Cancelar
                </button>
            {% endif %}
        </form>
    </td>
</tr>
