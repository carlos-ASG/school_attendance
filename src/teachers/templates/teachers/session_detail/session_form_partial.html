<form method="post"
      hx-post="{% url 'teachers:session_edit' session.pk %}"
      hx-target="#session-header"
      hx-swap="outerHTML"
      class="inline-form">
    {% csrf_token %}
    {{ form.date }}
    {% if form.date.errors %}
        <ul class="errorlist">{{ form.date.errors }}</ul>
    {% endif %}
    <button type="submit">Guardar</button>
</form>
