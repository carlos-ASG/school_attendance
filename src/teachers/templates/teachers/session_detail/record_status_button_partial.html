<button
    id="record-status-{{ record.pk }}"
    type="button"
    class="status-btn status-{{ record.status|lower }}"
    hx-post="{% url 'teachers:record_toggle_status' record.pk %}"
    hx-target="this"
    hx-swap="outerHTML">
    {{ record.get_status_display }}
</button>
{% if errors %}
    <ul class="errorlist">
        {% for field, msgs in errors.items %}
            {% for msg in msgs %}<li>{{ msg }}</li>{% endfor %}
        {% endfor %}
    </ul>
{% endif %}
