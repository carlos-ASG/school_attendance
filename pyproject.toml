[project]
name = "school-attendance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carlos Sandoval", email = "sycarlos@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-allauth>=65.19.3",
    "django-cotton>=2.7.2",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "django-import-export>=4.4.1",
    "django-ninja>=1.7.0",
    "django-tailwind-cli>=4.8.0",
    "django-unfold>=0.105.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pillow-heif>=1.7.0",
    "psycopg[binary]>=3.3.6",
    "uuid6>=2025.0.1",
]

[project.scripts]
school-attendance = "school_attendance:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["config", "accounts", "school", "teachers", "core_ui", "api"]
